name: Build YOYO Camera iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select working Xcode with iOS Platform
        run: |
          cd YOYO-Client
          SELECTED=""
          for xc in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Testing $xc..."
              sudo xcode-select -s "$xc/Contents/Developer"
              if xcodebuild -showdestinations -project Yoyo.xcodeproj -scheme Yoyo | grep -q "name:Any iOS Device" && ! xcodebuild -showdestinations -project Yoyo.xcodeproj -scheme Yoyo | grep -A 2 "name:Any iOS Device" | grep -q "error:iOS"; then
                echo "===> Found suitable Xcode: $xc"
                SELECTED="$xc"
                break
              fi
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "No Xcode has preinstalled iOS platform runtime. Attempting download..."
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
            sudo xcodebuild -downloadPlatform iOS || true
          fi

          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift Package Dependencies
        run: |
          cd YOYO-Client
          xcodebuild -resolvePackageDependencies -project Yoyo.xcodeproj -scheme Yoyo

      - name: Build App (Unsigned)
        run: |
          cd YOYO-Client
          xcodebuild build \
            -project Yoyo.xcodeproj \
            -scheme Yoyo \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath ./build

      - name: Package IPA
        run: |
          cd YOYO-Client
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Yoyo.app ./Payload/
          zip -r Yoyo.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoyo-Camera-Unsigned-IPA
          path: YOYO-Client/Yoyo.ipa
          retention-days: 14
