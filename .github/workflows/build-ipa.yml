name: Build YOYO Camera iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Wake up CoreSimulator and Download iOS Platform
        run: |
          xcrun simctl list > /dev/null 2>&1 || true
          sleep 2
          xcodebuild -downloadPlatform iOS

      - name: Verify Platforms and Destinations
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          cd YOYO-Client
          xcodebuild -showdestinations -project Yoyo.xcodeproj -scheme Yoyo

      - name: Resolve Swift Package Dependencies
        run: |
          cd YOYO-Client
          xcodebuild -resolvePackageDependencies -project Yoyo.xcodeproj -scheme Yoyo

      - name: Build App (Unsigned)
        run: |
          cd YOYO-Client
          xcodebuild build \
            -project Yoyo.xcodeproj \
            -scheme Yoyo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath ./build

      - name: Package IPA
        run: |
          cd YOYO-Client
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Yoyo.app ./Payload/
          zip -r Yoyo.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoyo-Camera-Unsigned-IPA
          path: YOYO-Client/Yoyo.ipa
          retention-days: 14
