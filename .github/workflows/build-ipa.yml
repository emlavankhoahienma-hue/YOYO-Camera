name: Build YOYO Camera iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          cd YOYO-Client
          xcodebuild -resolvePackageDependencies -project Yoyo.xcodeproj -scheme Yoyo

      - name: Build App (Unsigned)
        run: |
          cd YOYO-Client
          xcodebuild build \
            -project Yoyo.xcodeproj \
            -scheme Yoyo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build

      - name: Package IPA
        run: |
          cd YOYO-Client
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Yoyo.app ./Payload/
          zip -r Yoyo.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoyo-Camera-Unsigned-IPA
          path: YOYO-Client/Yoyo.ipa
          retention-days: 14
